<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PO Score System{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">PO Score System</a>
    {% if user.is_authenticated %}
    <form method="post" action="{% url 'accounts:logout' %}" class="d-flex align-items-center gap-3 mb-0">
      {% csrf_token %}
      {% if user.is_staff %}<a class="btn btn-warning btn-sm" href="{% url 'admin:index' %}">Admin panel</a>{% endif %}
      <span class="text-light small">{{ user }} &middot; {{ user.get_role_display }}</span>
      <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
    </form>
    {% endif %}
  </div>
</nav>
<main class="container pb-5">
  {% for message in messages %}
  <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
