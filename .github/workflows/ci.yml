name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: po_system
          POSTGRES_USER: po_user
          POSTGRES_PASSWORD: po_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U po_user -d po_system"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "False"
      USE_SQLITE: "False"
      POSTGRES_DB: po_system
      POSTGRES_USER: po_user
      POSTGRES_PASSWORD: po_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Make sure the tests really run on PostgreSQL
        run: |
          python -c "
          import os, django
          os.environ['DJANGO_SETTINGS_MODULE'] = 'config.settings'
          django.setup()
          from django.db import connection
          assert connection.vendor == 'postgresql', connection.vendor
          "

      - name: Check migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate

      - name: Run tests
        run: python manage.py test
